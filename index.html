<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nusantara Cultural Meta-Hub - ICP2E Blitar Raya</title>
  
  <!-- A-Frame 3D Engine -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Pi Network SDK v2 -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Panel UI mengambang di atas Canvas 3D */
    .ui-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999999; /* Memastikan di atas A-Frame */
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 260px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: auto; /* Memastikan klik tidak diserap 3D canvas */
    }
    .ui-title {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }
    .ui-sub {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 14px 0;
    }
    .btn-buy {
      background: #f97316;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 14px;
      display: block;
      text-align: center;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
      transition: transform 0.1s ease, background 0.2s ease;
      user-select: none;
      pointer-events: auto;
    }
    .btn-buy:active {
      transform: scale(0.98);
      background: #ea580c;
    }
    .btn-buy:disabled {
      background: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status-text {
      margin-top: 10px;
      font-size: 11px;
      color: #38bdf8;
      text-align: center;
      word-break: break-word;
    }
  </style>

  <!-- Script Logika Pembayaran -->
  <script src="logic_split.js" defer></script>
</head>
<body>

  <!-- UI Overlay Kaku -->
  <div class="ui-panel">
    <div class="ui-title">Meta-Hub ICP2E</div>
    <div class="ui-sub">Galeri & Lahan Budaya Virtual</div>
    <button id="btn-sewa-galeri" class="btn-buy" type="button">
      Sewa Galeri (10 Pi)
    </button>
    <div id="app-status" class="status-text">Menghubungkan Pi SDK...</div>
  </div>

  <!-- A-Frame 3D World (Sensor Gyro / Goyang Dinetralkan) -->
  <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <!-- Langit Metaverse -->
    <a-sky color="#0f172a"></a-sky>

    <!-- Papan Pameran Virtual -->
    <a-box position="0 1.8 -5" rotation="0 0 0" color="#1e1b4b" depth="0.1" height="2.2" width="4.2">
      <a-text value="Selamat Datang di\nNusantara Meta-Hub\nICP2E Blitar Raya" align="center" position="0 0 0.1" scale="1 1 1" color="#ffffff"></a-text>
    </a-box>

    <!-- Lantai Virtual -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#1e293b"></a-plane>
    
    <!-- Kamera Diam (Teks Tidak Goyang) -->
    <a-entity camera look-controls="magicWindowTrackingEnabled: false; touchEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

</body>
</html>
